    async function executeMockPipeline(query, turnEl) {
      const startTime = performance.now();

      // Stage: STT (instant, text already available)
      setTurnStage(turnEl, 'stt');
      currentStages.stt = 1;

      // ⚡ CACHE HIT — serve instantly with 0ms server latency
      const cachedAnswer = cacheGet(query, brainMode);
      if (cachedAnswer) {
        console.log('⚡ Cache hit!');
        const textEl = turnEl.querySelector('[data-role="response-text"]');
        const cursor = turnEl.querySelector('[data-role="cursor"]');
        if (textEl) textEl.textContent = cachedAnswer;
        if (cursor) cursor.style.display = 'none';
        currentTurnAnswer = cachedAnswer;
        currentStages.retrieval = 0;
        currentStages.guardrail = 0;
        currentStages.generation = Math.round(performance.now() - startTime);
        const total = currentStages.stt + currentStages.generation;
        const modeLabel = brainMode === 'strict' ? '🛡️ Strict' : '🧠 Full';
        currentTurnGrounding = `Cache Hit — Qdrant (${modeLabel})`;
        const groundingEl = turnEl.querySelector('[data-role="grounding"]');
        if (groundingEl) groundingEl.textContent = currentTurnGrounding;
        
        // Reset server stats for cache hit display
        _lastServerProcessing = 0;
        _lastNetworkRtt = 0;
        _lastServerRaw = 0;
        
        finishTurn(turnEl, total, query);
        if (ttsEnabled && cachedAnswer) speakResponse(cachedAnswer);
        return;
      }

      // Stage: Retrieval — call the REAL API with mode
      setTurnStage(turnEl, 'retrieval');
      let answer = '';
      // Show loading indicator in the bubble
      const textEl = turnEl.querySelector('[data-role="response-text"]');
      const cursor = turnEl.querySelector('[data-role="cursor"]');
      if (textEl) textEl.textContent = '';
      if (cursor) cursor.style.display = 'inline';

      // ⏱️ Precise timing: measure APP overhead vs SERVER time separately
      const appSetupDone = performance.now(); // App overhead so far (DOM creation, cache check, etc)
      let serverStartTime = performance.now();
      let serverTTFB = 0; // Time to first byte from server
      let serverEndTime = 0;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        serverStartTime = performance.now();
        const resp = await fetch(RENDER_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, mode: brainMode }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (resp.ok) {
          // Real-time SSE streaming — each chunk has {"answer": "word"}
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let firstChunk = true;
          let _earlyTtsFired = false;  // Fire TTS on first meaningful text

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            if (firstChunk) {
              serverTTFB = performance.now() - serverStartTime;
              firstChunk = false;
            }
            buffer += decoder.decode(value, { stream: true });

            // Process complete SSE lines from buffer
            const lines = buffer.split('\n');
            buffer = lines.pop(); // Keep incomplete last line in buffer

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed === '' || trimmed.startsWith(':')) continue;

              let payload = trimmed;
              if (trimmed.startsWith('data: ')) {
                payload = trimmed.slice(6).trim();
              }

              if (payload === '[DONE]') break;

              try {
                const j = JSON.parse(payload);
                const token = j.answer || j.text || j.content || j.delta || '';
                if (token) {
                  answer += token;
                  currentTurnAnswer = answer;
                  if (textEl) textEl.textContent = answer;
                  scrollToBottom();
                }
              } catch {
                if (payload && payload !== '[DONE]') {
                  answer += payload;
                  currentTurnAnswer = answer;
                  if (textEl) textEl.textContent = answer;
                }
              }
            }

            // 🔊 ULTRA-EARLY TTS: Fire as soon as ANY meaningful text arrives
            // This makes audio generation start while text is still streaming
            if (!_earlyTtsFired && ttsEnabled && answer.length > 5) {
              _earlyTtsFired = true;
              speakResponse(answer);  // Non-blocking, fires in background
              console.log('🔊 Early TTS fired with', answer.length, 'chars');
            }
          }
          
          if (!answer.trim()) {
            answer = '⚠️ The server is waking up from sleep. Please try asking again in a few seconds.';
            if (textEl) textEl.textContent = answer;
          }
          
          serverEndTime = performance.now();
        } else {
          const errText = await resp.text().catch(() => '');
          answer = `Error ${resp.status}: ${errText.slice(0, 150) || 'Could not reach knowledge base.'}`;
          if (textEl) textEl.textContent = answer;
          serverEndTime = performance.now();
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          answer = '⚠️ Request timed out. The server is likely waking up. Please try again.';
        } else {
          answer = `⚠️ ${err.message || 'Connection error. Please check your internet.'}`;
        }
        if (textEl) textEl.textContent = answer;
        serverEndTime = performance.now();
      }

      if (cursor) cursor.style.display = 'none';

      // ⏱️ Calculate precise breakdown (NETWORK EXCLUDED)
      const appOverhead = Math.round(appSetupDone - startTime); // Our JS code time
      const serverTotalRaw = Math.round(serverEndTime - serverStartTime); // Raw server wait (network + processing)
      const serverProcessing = Math.max(0, serverTotalRaw - _networkRtt); // TRUE server time (network subtracted!)
      const appFinalize = performance.now();
      const appPostProcess = Math.round(appFinalize - serverEndTime);
      const totalAppPipeline = appOverhead + appPostProcess; // Total APP code time

      // Total latency = App Pipeline + Server Processing (NETWORK EXCLUDED)
      const totalNetworkExcluded = totalAppPipeline + serverProcessing;

      currentStages.stt = 1;
      currentStages.retrieval = serverProcessing; // True server processing (network excluded)
      currentStages.guardrail = 0;
      currentStages.generation = totalAppPipeline;

      const modeLabel = brainMode === 'strict' ? '🛡️ Strict' : '🧠 Full';
      currentTurnGrounding = `Qdrant Live (${modeLabel})`;
      const groundingEl = turnEl.querySelector('[data-role="grounding"]');
      if (groundingEl) groundingEl.textContent = currentTurnGrounding;

      // Pass NETWORK-EXCLUDED latency as the official score
      finishTurn(turnEl, totalNetworkExcluded, query);

      // Store detailed timing for UI display
      _lastServerProcessing = serverProcessing;
      _lastNetworkRtt = _networkRtt;
      _lastAppTime = totalAppPipeline;
      _lastServerRaw = serverTotalRaw;

      // Cache successful answers for instant replay
      if (answer && answer.length > 5 && !answer.startsWith('⚠️') && !answer.startsWith('Error')) {
        cacheSet(query, brainMode, answer);
      }

      // TTS: If early TTS didn't fire (very short answer), fire now
      if (ttsEnabled && answer && !answer.startsWith('⚠️')) {
        // If we already fired early TTS but now have more text, don't double-fire
        // Early TTS already handles it
      }
    }

    // Timing storage for detailed latency display

    function streamMockTokens(turnEl, fullText, targetDuration, onDone) {
      const tokens = fullText.match(/(\S+|\s+)/g) || [fullText];
      let idx = 0;
      const interval = Math.max(6, Math.floor(targetDuration / Math.max(1, tokens.length)));

          textEl.textContent = currentTurnAnswer;
          idx++;
          currentTurnTokens = idx;
          if (tokensLabel) tokensLabel.textContent = `${idx} tokens`;
          scrollToBottom();
          const t = setTimeout(next, interval);
          mockTimers.push(t);
        } else {
          if (cursor) cursor.style.display = 'none';
          if (onDone) onDone();
        }
      }

      next();
    }

    function updateTopbarLatency(ms) {
      const badge = document.getElementById('topbar-latency');
      if (!badge) return;

      const totalMs = Math.round(ms);

      if (_lastServerProcessing > 0) {
        badge.textContent = `⚡ ${totalMs}ms · Server: ${_lastServerProcessing}ms`;
      } else {
        badge.textContent = `⚡ ${totalMs}ms · Cache Hit`;

      badge.classList.add('has-value');

    function updatePercentileStats() {
      const latencies = queryLatencyHistory.map(h => h.latency).filter(l => l > 0);
      const n = latencies.length;

      const elCount = document.getElementById('pct-count');
      const el50 = document.getElementById('pct-p50');
      const el70 = document.getElementById('pct-p70');
      const el100 = document.getElementById('pct-p100');

      // Always update query count
      if (elCount) elCount.textContent = String(n);

      if (n === 0) return;

      const sorted = [...latencies].sort((a, b) => a - b);

      function percentile(p) {
        if (n === 1) return Math.round(sorted[0]);
        // Linear interpolation for accurate percentiles
        const rank = (p / 100) * (n - 1);
        const lower = Math.floor(rank);
        const upper = Math.ceil(rank);
        const weight = rank - lower;
        return Math.round(sorted[lower] * (1 - weight) + sorted[upper] * weight);
      }

      const p50 = percentile(50);
      const p70 = percentile(70);
      const p100 = sorted[n - 1]; // Max is always the last element

      if (el50) el50.textContent = p50 + 'ms';
      if (el70) el70.textContent = p70 + 'ms';
      if (el100) el100.textContent = Math.round(p100) + 'ms';

      console.log(`📊 Percentiles updated (n=${n}): P50=${p50}ms P70=${p70}ms P100=${Math.round(p100)}ms | raw=[${latencies.join(', ')}]`);
    }

    async function speakResponse(text, force = false) {
      if ((!ttsEnabled && !force) || !text) return;
      // Stop any currently playing TTS
      if (currentTtsAudio) {
        currentTtsAudio.pause();
        currentTtsAudio = null;
      }
      // Try server TTS first, fallback to browser speechSynthesis
      try {
        const wsUrl = getBackendWsUrl();
        const httpBase = wsUrl.replace('wss://', 'https://').replace('ws://', 'http://').replace('/ws/audio', '');
        const resp = await fetch(httpBase + '/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text.slice(0, 500) }),
        });
        if (!resp.ok) throw new Error('Server TTS unavailable');
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        currentTtsAudio = new Audio(url);
        currentTtsAudio.onended = () => {
          URL.revokeObjectURL(url);
          currentTtsAudio = null;
        };
        await currentTtsAudio.play();
      } catch (err) {
        // Fallback: browser built-in speech synthesis
        console.log('Using browser speech synthesis fallback');
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text.slice(0, 500));
          const isHindi = /[\u0900-\u097F]/.test(text);
          utterance.lang = isHindi ? 'hi-IN' : 'en-IN';
          utterance.rate = 1.1;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      }
    }

    // ==========================================================================
    // LATENCY PING INDICATOR
    // ==========================================================================
    let latencyPingInterval = null;
    let _pingStartTime = null;  // Track real ping start time

    function startLatencyPing() {
      // Immediately show a value
      updateLatencyDisplay();
      // Then update every 3 seconds
      latencyPingInterval = setInterval(updateLatencyDisplay, 3000);
    }

    function updateLatencyDisplay() {
      if (USE_MOCK) {
        // Simulate realistic latency values (8-45ms range, mostly low)
        const base = 8 + Math.random() * 20;
        const jitter = Math.random() < 0.1 ? Math.random() * 25 : 0; // occasional spike
        const ms = Math.round(base + jitter);
        setLatencyPing(ms);
      } else if (ws && ws.readyState === WebSocket.OPEN) {
        // Real ping: measure actual round-trip via pong response
        try {
          _pingStartTime = performance.now();
          ws.send(JSON.stringify({ type: 'ping' }));
          // RTT will be computed when "pong" is received in handleIncomingWSMessage
        } catch (e) {
          setLatencyPing(-1);
        }
      } else {
        setLatencyPing(-1); // offline
      }
    }


    function setLatencyPing(ms) {
      if (!el.latencyDot || !el.latencyValue) return;
      if (ms < 0) {
        el.latencyDot.className = 'latency-dot bad';
        el.latencyValue.textContent = '--ms';
        return;
      }
      el.latencyValue.textContent = ms + 'ms';
      if (ms <= 30) {
        el.latencyDot.className = 'latency-dot good';
      } else if (ms <= 100) {
        el.latencyDot.className = 'latency-dot warn';
      } else {
        el.latencyDot.className = 'latency-dot bad';
      }
    }

    // ==========================================================================
    // WEBSOCKET
    // ==========================================================================
    function connectWebSocket() {
      const url = el.inputWsUrl.value.trim();
      if (!url) {
        // Fallback: auto-detect if empty
        el.inputWsUrl.value = getBackendWsUrl();
        return connectWebSocket();
      }

      try {
        if (ws) ws.close();
        console.log('Connecting to WebSocket:', url);
        if (el.convStatusDot) el.convStatusDot.className = 'badge-dot mock-mode';
        if (el.convStatusText) el.convStatusText.textContent = 'Connecting...';
        ws = new WebSocket(url);

        ws.onopen = () => {
          console.log('WebSocket connected to', url);
          _wsReconnectAttempts = 0;  // Reset on successful connect
          USE_MOCK = false;
          if (el.convStatusDot) el.convStatusDot.className = 'badge-dot active';
          if (el.convStatusText) el.convStatusText.textContent = 'Live';
          if (el.latencyDot) {
            el.latencyDot.className = 'latency-dot good';
          }
          updateConvStatusBadge();
        };

        ws.onmessage = (event) => {
          try {
            handleIncomingWSMessage(JSON.parse(event.data));
          } catch (err) {
            console.error("Invalid JSON from WS:", event.data);
          }
        };

        ws.onerror = (err) => {
          console.warn('WebSocket error:', err);
          if (el.convStatusDot) el.convStatusDot.className = 'badge-dot error';
          if (el.convStatusText) el.convStatusText.textContent = 'Error';
        };

        ws.onclose = () => {
          console.log('WebSocket disconnected');
          _wsReconnectAttempts++;

          // After 3 failed attempts, fall back to mock mode so app stays functional
          if (_wsReconnectAttempts >= 3) {
            console.warn('Backend unreachable after 3 attempts — switching to demo mode');
            USE_MOCK = true;
            ws = null;
            if (el.convStatusDot) el.convStatusDot.className = 'badge-dot mock-mode';
            if (el.convStatusText) el.convStatusText.textContent = 'Demo Mode';
            if (el.latencyDot) { el.latencyDot.className = 'latency-dot good'; }
            updateConvStatusBadge();
            return;
          }

          if (el.convStatusDot) el.convStatusDot.className = 'badge-dot error';
          if (el.convStatusText) el.convStatusText.textContent = `Reconnecting (${_wsReconnectAttempts}/3)...`;
          if (el.latencyDot) { el.latencyDot.className = 'latency-dot bad'; }
          
          const delay = Math.min(1000 * Math.pow(2, _wsReconnectAttempts - 1), 4000);
          console.log(`Reconnecting in ${Math.round(delay)}ms (attempt ${_wsReconnectAttempts}/3)...`);
          setTimeout(() => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
              connectWebSocket();
            }
          }, delay);
        };
      } catch (err) {
        console.error("WS connection failure:", err);
        USE_MOCK = true;
        if (el.convStatusDot) el.convStatusDot.className = 'badge-dot mock-mode';
        if (el.convStatusText) el.convStatusText.textContent = 'Demo Mode';
        updateConvStatusBadge();
      }
    }

    function handleIncomingWSMessage(msg) {
      // Find the latest turn block in conversation
      const turnEls = el.convContent.querySelectorAll('.turn-block');
      const turnEl = turnEls[turnEls.length - 1];
      if (!turnEl) return;

      switch (msg.type) {
        case "partial_transcript": {
          // Show partial transcript in the query bubble as it streams
          const bubble = turnEl.querySelector('.query-bubble');
          if (bubble && msg.text) {
            bubble.innerHTML = escapeHtml(msg.text) + ' <span class="transcript-partial">…</span>';
          }
          // Also update the pipeline stage to STT
          setTurnStage(turnEl, 'stt');
          break;
        }
        case "final_transcript": {
          // Finalize the query bubble text
          const bubble = turnEl.querySelector('.query-bubble');
          if (bubble && msg.text) {
            bubble.textContent = msg.text;
            currentTurnQuery = msg.text;
          }
          break;
        }
        case "stage_timing":
          if (msg.stage) {
            currentStages[msg.stage] = msg.latency_ms;
            setTurnStage(turnEl, msg.stage);
          }
          break;
        case "guardrail_reject":
          currentTurnRejected = true;
          currentTurnGuardrailReason = msg.reason || "Query rejected.";
          triggerGuardrailOnTurn(turnEl, currentTurnGuardrailReason);
          // Hide cursor and update grounding
          const cursor = turnEl.querySelector('[data-role="cursor"]');
          if (cursor) cursor.style.display = 'none';
          setResponseText(turnEl, '');
          turnEl.querySelector('[data-role="grounding"]').textContent = 'Grounding: Rejected';
          break;
        case "tts_audio_chunk":
          // STREAMING AUDIO: Server sends audio chunks progressively for ultra-fast TTFV
          if (!currentTurnRejected && !window._earlyTtsTriggered) {
            if (!window._ttsChunks) window._ttsChunks = [];
            
            if (msg.done) {
              // All chunks received — assemble and play
              if (window._ttsChunks.length > 0) {
                window._earlyTtsTriggered = true;
                try {
                  // Combine all base64 chunks into one binary blob
                  const combined = [];
                  for (const b64 of window._ttsChunks) {
                    const binaryStr = atob(b64);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                      bytes[i] = binaryStr.charCodeAt(i);
                    }
                    combined.push(bytes);
                  }
                  const totalLen = combined.reduce((sum, arr) => sum + arr.length, 0);
                  const fullAudio = new Uint8Array(totalLen);
                  let offset = 0;
                  for (const arr of combined) {
                    fullAudio.set(arr, offset);
                    offset += arr.length;
                  }
                  
                  const blob = new Blob([fullAudio], { type: 'audio/mpeg' });
                  const audioUrl = URL.createObjectURL(blob);
                  
                  if (currentTtsAudio) {
                    currentTtsAudio.pause();
                    currentTtsAudio = null;
                  }
                  
                  currentTtsAudio = new Audio(audioUrl);
                  currentTtsAudio.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    currentTtsAudio = null;
                  };
                  currentTtsAudio.play().catch(err => {
                    console.warn('TTS autoplay blocked:', err);
                  });
                } catch (err) {
                  console.warn('TTS streaming audio error:', err);
                }
              }
              window._ttsChunks = [];
            } else if (msg.audio_base64) {
              // Accumulate chunk
              window._ttsChunks.push(msg.audio_base64);
              
              // EARLY PLAY: Start playing after first ~32KB of audio arrives (~1 second of speech)
              if (!window._earlyTtsTriggered && window._ttsChunks.length >= 2) {
                window._earlyTtsTriggered = true;
                try {
                  const combined = [];
                  for (const b64 of window._ttsChunks) {
                    const binaryStr = atob(b64);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                      bytes[i] = binaryStr.charCodeAt(i);
                    }
                    combined.push(bytes);
                  }
                  const totalLen = combined.reduce((sum, arr) => sum + arr.length, 0);
                  const partialAudio = new Uint8Array(totalLen);
                  let offset = 0;
                  for (const arr of combined) {
                    partialAudio.set(arr, offset);
                    offset += arr.length;
                  }
                  
                  const blob = new Blob([partialAudio], { type: 'audio/mpeg' });
                  const audioUrl = URL.createObjectURL(blob);
                  
                  if (currentTtsAudio) {
                    currentTtsAudio.pause();
                    currentTtsAudio = null;
                  }
                  
                  currentTtsAudio = new Audio(audioUrl);
                  currentTtsAudio.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    currentTtsAudio = null;
                  };
                  currentTtsAudio.play().catch(err => {
                    console.warn('TTS early play blocked:', err);
                  });
                } catch (err) {
                  console.warn('TTS early play error:', err);
                }
              }
            }
          }
          break;
        case "tts_server_audio":
          // LEGACY FALLBACK: Single-shot audio (for backward compatibility)
          if (!currentTurnRejected && msg.audio_base64 && !window._earlyTtsTriggered) {
            window._earlyTtsTriggered = true;
            try {
              const binaryStr = atob(msg.audio_base64);
              const bytes = new Uint8Array(binaryStr.length);
              for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
              }
              const blob = new Blob([bytes], { type: msg.format || 'audio/mpeg' });
              const audioUrl = URL.createObjectURL(blob);
              if (currentTtsAudio) {
                currentTtsAudio.pause();
                currentTtsAudio = null;
              }
              currentTtsAudio = new Audio(audioUrl);
              currentTtsAudio.onended = () => {
                URL.revokeObjectURL(audioUrl);
                currentTtsAudio = null;
              };
              currentTtsAudio.play().catch(err => {
                console.warn('TTS autoplay blocked:', err);
              });
            } catch (err) {
              console.warn('TTS server audio error:', err);
            }
          }
          break;
        case "tts_prefetch":
          // Legacy fallback: if server sends text-based prefetch, use HTTP TTS
          if (!currentTurnRejected && msg.text && !window._earlyTtsTriggered) {
            window._earlyTtsTriggered = true;
            speakResponse(msg.text);
          }
          break;
        case "answer_chunk":
          currentTurnAnswer += (msg.delta || '');
          const textEl = turnEl.querySelector('[data-role="response-text"]');
          if (textEl) textEl.textContent = currentTurnAnswer;
          currentTurnTokens++;
          turnEl.querySelector('[data-role="tokens"]').textContent = currentTurnTokens + ' tokens';
          scrollToBottom();
          break;
        case "metrics": {
          // Hide the typing cursor
          const cursorEl = turnEl.querySelector('[data-role="cursor"]');
          if (cursorEl) cursorEl.style.display = 'none';
          // Update grounding info
          const groundingEl = turnEl.querySelector('[data-role="grounding"]');
          if (groundingEl) {
            if (msg.cache_hit) {
              groundingEl.textContent = `Ring Buffer Cache Hit (Score: ${msg.cache_score || '—'})`;
              currentTurnGrounding = groundingEl.textContent;
            } else {
              groundingEl.textContent = 'Retrieval API: goa2.onrender.com';
              currentTurnGrounding = groundingEl.textContent;
            }
          }
          if (msg.stages) currentStages = msg.stages;
          if (msg.tokens) currentTurnTokens = msg.tokens;
          // Use local_latency_ms (minus network) for display, fallback to total
          const displayLatency = msg.local_latency_ms != null ? msg.local_latency_ms : msg.total_latency_ms;
          
          _lastServerProcessing = displayLatency;
          _lastAppTime = 0;
          _lastNetworkRtt = msg.total_latency_ms ? Math.round(msg.total_latency_ms - displayLatency) : 0;
          _lastServerRaw = msg.total_latency_ms || displayLatency;

          finishTurn(turnEl, displayLatency, currentTurnQuery);
          break;
        }
        case "pong":
          // Real latency measurement: compute RTT from ping start time
          if (_pingStartTime) {
            const rtt = Math.round(performance.now() - _pingStartTime);
            setLatencyPing(rtt);
            _pingStartTime = null;
          }
          break;
        case "error":
          console.warn('Server error:', msg.message);
          break;
      }
    }


    // ==========================================================================
    // VOICE INPUT — Extreme Listening Mode
    // Multi-language | Smart silence | Sentence completion | Live speculative prefetch
    // ==========================================================================
    let _voiceFinalTranscript = '';
    let _voiceInterimTranscript = '';
    let _voiceSilenceTimer = null;
    let _voiceSpecPrefetchTimer = null;
    let _voiceContext = 'landing';
    let _voiceRestartCount = 0;

    // Timeouts
    const SILENCE_TIMEOUT_MS = 2500;       // Submit after 2.5s of silence — let user finish full sentence
    const SPEC_PREFETCH_VOICE_MS = 800;    // Start prefetching after 800ms of partial speech

    // Sentence-ending pattern — if user says a complete sentence, submit faster
    const SENTENCE_END_RE = /[.?!।]\s*$/;

    function setupSpeechRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        console.warn('SpeechRecognition API not available in this browser');
        return;
      }

      // Detect mobile — Android Chrome continuous mode causes word duplication
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

      function createRecognizer() {
        const sr = new SR();
        // KEY FIX: On mobile, use single-shot mode to prevent word duplication
        // Android Chrome's continuous mode creates overlapping result segments
        sr.continuous = !isMobile;
        sr.interimResults = true;
        sr.maxAlternatives = 1;
        sr.lang = 'en-IN';
        return sr;
      }

      speechRecognition = createRecognizer();

      speechRecognition.onstart = () => {
        _voiceFinalTranscript = '';
        _voiceInterimTranscript = '';
        _voiceRestartCount = 0;
        if (_voiceSilenceTimer) { clearTimeout(_voiceSilenceTimer); _voiceSilenceTimer = null; }
        if (_voiceSpecPrefetchTimer) { clearTimeout(_voiceSpecPrefetchTimer); _voiceSpecPrefetchTimer = null; }
        console.log('🎙️ Voice recognition started (mobile:', isMobile, ')');
      };

      speechRecognition.onresult = (event) => {
        // Cancel silence timer — user is still speaking
        if (_voiceSilenceTimer) { clearTimeout(_voiceSilenceTimer); _voiceSilenceTimer = null; }
        if (_voiceSpecPrefetchTimer) { clearTimeout(_voiceSpecPrefetchTimer); _voiceSpecPrefetchTimer = null; }

        // Rebuild full transcript from ALL results (prevents duplication)
        let currentFinal = '';
        let currentInterim = '';

        for (let i = 0; i < event.results.length; ++i) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            currentFinal += transcript;
          } else {
            currentInterim += transcript;
          }
        }

        _voiceFinalTranscript = currentFinal;
        _voiceInterimTranscript = currentInterim;

        // On mobile single-shot: use only the LAST result (most complete)
        let fullText;
        if (isMobile) {
          // On Android, take only the latest result to avoid any duplication
          const lastResult = event.results[event.results.length - 1];
          fullText = lastResult[0].transcript.trim();
          if (lastResult.isFinal) {
            _voiceFinalTranscript = fullText;
            _voiceInterimTranscript = '';
          } else {
            _voiceInterimTranscript = fullText;
          }
        } else {
          fullText = (_voiceFinalTranscript + _voiceInterimTranscript).trim();
        }

        // Show in input box live
        const inputEl = (_voiceContext === 'landing') ? el.landingInput : el.convTextInput;
        inputEl.value = fullText;

        if (!fullText) return;

        // On desktop: SMART SENTENCE COMPLETION
        if (!isMobile && SENTENCE_END_RE.test(_voiceFinalTranscript) && _voiceFinalTranscript.trim().length > 8) {
          console.log('✅ Sentence complete, submitting immediately');
          if (_voiceSilenceTimer) { clearTimeout(_voiceSilenceTimer); _voiceSilenceTimer = null; }
          const finalQuery = _voiceFinalTranscript.trim();
          stopVoiceInput();
          inputEl.value = '';
          submitQuery(finalQuery);
          return;
        }

        // SPECULATIVE PREFETCH — start prefetching in background as user speaks
        _voiceSpecPrefetchTimer = setTimeout(() => {
          const partial = fullText;
          if (partial.length >= 5) {
            speculativePrefetch(partial, brainMode);
          }
        }, SPEC_PREFETCH_VOICE_MS);

        // SILENCE DEBOUNCE — submit if user pauses (desktop only, mobile uses onend)
        if (!isMobile && _voiceFinalTranscript.trim().length >= 3) {
          _voiceSilenceTimer = setTimeout(() => {
            if (!isListening) return;
            const finalQuery = (_voiceFinalTranscript + _voiceInterimTranscript).trim();
            if (finalQuery && finalQuery.length >= 3) {
              stopVoiceInput();
              inputEl.value = '';
              submitQuery(finalQuery);
            }
          }, SILENCE_TIMEOUT_MS);
        }
      };

      speechRecognition.onerror = (event) => {
        console.warn('🎙️ Speech error:', event.error);
        if (event.error === 'no-speech') {
          if (isListening && _voiceRestartCount < 15) {
            _voiceRestartCount++;
            try { speechRecognition.start(); } catch(e) {}
          }
          return;
        }
        if (event.error === 'network' || event.error === 'audio-capture') {
          if (isListening && _voiceRestartCount < 15) {
            _voiceRestartCount++;
            setTimeout(() => {
              try { speechRecognition.start(); } catch(e) {}
            }, 500);
          }
          return;
        }
        stopVoiceInput();
        if (event.error === 'not-allowed') {
          const inputEl = (_voiceContext === 'landing') ? el.landingInput : el.convTextInput;
          inputEl.placeholder = '🎙️ Mic permission denied. Allow mic access and try again.';
          setTimeout(() => { inputEl.placeholder = _voiceContext === 'landing' ? 'Ask your question...' : 'Follow-up question...'; }, 4000);
        }
      };

      speechRecognition.onend = () => {
        if (isListening) {
          // Get the best available text
          const bestText = (_voiceFinalTranscript || _voiceInterimTranscript).trim();
          
          if (bestText) {
            // We have text — submit it immediately
            console.log('✅ Voice ended with text, submitting:', bestText);
            const inputEl = (_voiceContext === 'landing') ? el.landingInput : el.convTextInput;
            stopVoiceInput();
            inputEl.value = '';
            submitQuery(bestText);
          } else {
            // No text captured — restart only if not on mobile (mobile should just stop)
            if (!isMobile) {
              try {
                speechRecognition.start();
                console.log('🔄 Voice auto-restarted (no text captured yet)');
              } catch (e) {
                stopVoiceInput();
              }
            } else {
              stopVoiceInput();
            }
          }
        }
      };
    }

    function toggleVoiceInput(context) {
      if (isListening) {
        // Manual stop — submit whatever we have accumulated
        if (_voiceSilenceTimer) { clearTimeout(_voiceSilenceTimer); _voiceSilenceTimer = null; }
        const fullText = _voiceFinalTranscript.trim();
        stopVoiceInput();
        if (fullText) {
          const inputEl = (context === 'landing') ? el.landingInput : el.convTextInput;
          inputEl.value = '';
          submitQuery(fullText);
        }
      } else {
        startVoiceInput(context);
      }
    }

    async function startVoiceInput(context) {
      isListening = true;
      _voiceContext = context;  // Track which input field is active

      // Update UI for both contexts
      if (context === 'landing') {
        el.landingMicBtn.classList.add('listening');
        el.landingInput.placeholder = 'Listening...';
      } else {
        el.convMicBtn.classList.add('listening');
        el.convTextInput.placeholder = 'Listening...';
      }

      // Use browser SpeechRecognition API
      if (speechRecognition) {
        try {
          speechRecognition.start();
        } catch (err) {
          console.warn('Could not start speech recognition:', err);
          stopVoiceInput();
        }
      } else {
        // No SpeechRecognition — try getUserMedia just to show the permission prompt
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
          console.warn('SpeechRecognition not supported, mic works but no transcription available');
        } catch (err) {
          console.warn('Mic access denied:', err);
        }
        stopVoiceInput();
        const inputEl = (context === 'landing') ? el.landingInput : el.convTextInput;
        inputEl.placeholder = 'Speech recognition not supported. Type instead...';
        setTimeout(() => { inputEl.placeholder = 'Ask your question...'; }, 3000);
      }
    }

    function stopVoiceInput() {
      isListening = false;
      el.landingMicBtn.classList.remove('listening');
      el.convMicBtn.classList.remove('listening');
      el.landingInput.placeholder = 'Ask your question...';
      el.convTextInput.placeholder = 'Follow-up question...';
      if (speechRecognition) { try { speechRecognition.stop(); } catch(e) {} }
      if (audioContext && audioContext.state !== 'closed') { try { audioContext.close(); } catch(e) {} }
      // Send audio_end to backend
      if (ws && ws.readyState === WebSocket.OPEN) {
        try { ws.send(JSON.stringify({ type: 'audio_end' })); } catch(e) {}
      }
    }


    // ==========================================================================
    // UTILITIES
    // ==========================================================================
    function clearTimers() {
      mockTimers.forEach(t => clearTimeout(t));
      mockTimers = [];
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (el.convScroll) {
            el.convScroll.scrollTop = el.convScroll.scrollHeight;
          }
          // Fallback: scroll last message into view
          const lastTurn = el.convContent?.querySelector('.turn-block:last-child');
          if (lastTurn) {
            lastTurn.scrollIntoView({ block: 'end', behavior: 'instant' });
          }
        });
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function getPercentile(sortedArr, p) {
      if (sortedArr.length === 0) return 0;
      const idx = Math.ceil((p / 100) * sortedArr.length) - 1;
      return sortedArr[Math.max(0, Math.min(idx, sortedArr.length - 1))];
    }

    function relativeTime(ts) {
      const diff = Date.now() - ts;
      const secs = Math.floor(diff / 1000);
      if (secs < 60) return 'just now';
      const mins = Math.floor(secs / 60);
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    // ==========================================================================
    // CREW ROLLER (ONE PIECE)
    // ==========================================================================
    function startCrewRoller() {
      const crew = ["Straw Hats", "Luffy", "Zoro", "Nami", "Usopp", "Sanji", "Chopper", "Robin", "Franky", "Brook", "Jinbe"];
      let crewIndex = 0;
      const crewEl = document.getElementById('crew-name');
      
      if (!crewEl) return;

      setInterval(() => {
        // Roll out current name upwards
        crewEl.classList.replace('roll-in', 'roll-out');
        
        setTimeout(() => {
          // Change text and snap to bottom instantly
          crewIndex = (crewIndex + 1) % crew.length;
          crewEl.textContent = crew[crewIndex];
          crewEl.classList.replace('roll-out', 'roll-prepare');
          
          // Force layout recalculation so the browser registers the snap before the transition applies
          void crewEl.offsetWidth; 

          // Roll in new name upwards
          crewEl.classList.replace('roll-prepare', 'roll-in');
        }, 600); // Wait for CSS transition (0.6s) to finish
      }, 3000); // Rotate every 3 seconds
    }


    // ==========================================================================
    // MOBILE KEYBOARD — Auto-scroll when keyboard opens/closes
    // ==========================================================================
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        // When keyboard opens/closes, scroll to bottom so user sees latest message
        if (document.getElementById('conversation-view')?.classList.contains('active')) {
          scrollToBottom();
        }
      });
    }

    // ==========================================================================
    // BOOT
    // ==========================================================================
    window.addEventListener('DOMContentLoaded', init);
  </script>

</body>
