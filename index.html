<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JARVIS — Voice Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       DESIGN SYSTEM — Glassmorphism + Gemini Rounded
       ========================================================================== */
    :root {
      /* Glass tokens */
      --glass-bg: rgba(15, 15, 20, 0.4);
      --glass-bg-heavy: rgba(15, 15, 20, 0.55);
      --glass-bg-light: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(255, 255, 255, 0.14);
      --glass-blur: blur(20px);
      --glass-blur-heavy: blur(30px);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      --glass-shadow-lg: 0 16px 48px 0 rgba(0, 0, 0, 0.35);
      --glass-hover: rgba(255, 255, 255, 0.1);

      /* Legacy (kept for JS references) */
      --bg-deep: transparent;
      --bg-surface: rgba(15, 15, 20, 0.35);
      --bg-surface-elevated: rgba(25, 25, 35, 0.45);
      --bg-input: rgba(255, 255, 255, 0.06);
      --bg-input-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --border-subtle: rgba(255, 255, 255, 0.04);

      --text-primary: #f0f0f5;
      --text-secondary: #b8bcc8;
      --text-muted: #7f8694;
      --text-dim: #5a5f6d;
      --text-greeting: #e8e8ed;

      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.22);
      --accent-subtle: rgba(99, 102, 241, 0.1);

      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.12);
      --success-border: rgba(52, 211, 153, 0.25);

      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.1);
      --danger-border: rgba(248, 113, 113, 0.25);

      --warning: #fbbf24;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Gemini-style heavy rounding */
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 24px;
      --radius-xl: 28px;
      --radius-full: 9999px;

      --sidebar-width: 280px;
      --sidebar-collapsed: 60px;
      --transition-fast: 0.18s ease;
      --transition-normal: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background: #050508;
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }

    /* Video Background */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      z-index: -2;
      pointer-events: none;
    }

    #bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(5, 5, 10, 0.55);
      z-index: -1;
      pointer-events: none;
    }

    /* ==========================================================================
       APP SHELL — Sidebar + Main area (no grid lines)
       ========================================================================== */
    .app-shell {
      display: flex;
      height: 100dvh;
      width: 100%;
      padding: 10px;
      gap: 10px;
    }

    /* --- SIDEBAR — Floating glass panel --- */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur-heavy);
      -webkit-backdrop-filter: var(--glass-blur-heavy);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
      transition: width var(--transition-normal), min-width var(--transition-normal),
                  border-radius var(--transition-normal);
      overflow: hidden;
      z-index: 20;
      box-shadow: var(--glass-shadow);
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed);
      min-width: var(--sidebar-collapsed);
      border-radius: var(--radius-xl);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 14px;
      flex-shrink: 0;
      /* No border-bottom */
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      white-space: nowrap;
    }

    .sidebar-logo {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .sidebar-brand-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .sidebar.collapsed .sidebar-brand-text,
    .sidebar.collapsed .sidebar-new-chat-text,
    .sidebar.collapsed .conv-item-text,
    .sidebar.collapsed .sidebar-footer-text {
      opacity: 0;
      width: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    
    .sidebar.collapsed .sidebar-footer {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .btn-sidebar-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .btn-sidebar-toggle:hover {
      color: var(--text-primary);
      background: var(--glass-hover);
    }

    .sidebar-actions {
      padding: 6px 10px 6px;
      flex-shrink: 0;
    }

    .btn-new-chat {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      overflow: hidden;
      white-space: nowrap;
    }

    .btn-new-chat:hover {
      background: var(--glass-hover);
      color: var(--text-primary);
      border-color: var(--glass-border-hover);
    }
    .sidebar.collapsed .btn-new-chat { justify-content: center; padding: 10px; }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .conv-section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      padding: 12px 8px 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      overflow: hidden;
    }

    .conv-item:hover { background: var(--glass-hover); }
    .conv-item.active {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--glass-border-hover);
    }

    .conv-item-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      color: var(--text-dim);
    }

    .conv-item-text {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
    }

    .conv-item-title {
      font-size: 12.5px;
      color: var(--text-secondary);
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .conv-item-time {
      font-size: 10px;
      color: var(--text-dim);
    }

    .conv-item.active .conv-item-title { color: var(--text-primary); }

    .sidebar-footer {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-shrink: 0;
      cursor: pointer;
      transition: background var(--transition-fast), justify-content var(--transition-fast);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
    }

    .sidebar-footer:hover { background: var(--glass-hover); }

    .sidebar-footer-icon {
      width: 16px;
      height: 16px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .sidebar-footer-text {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
    }

    /* --- MAIN CONTENT --- */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 20px);
      overflow: hidden;
      position: relative;
      border-radius: var(--radius-xl);
    }

    /* ==========================================================================
       LANDING SCREEN — Floating glass over video
       ========================================================================== */
    .landing-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease, transform 0.4s ease;
      /* Subtle radial glow, mostly transparent */
      background:
        radial-gradient(ellipse 60% 45% at 50% 55%, rgba(99, 102, 241, 0.08) 0%, transparent 65%);
      border-radius: var(--radius-xl);
    }

    .landing-screen.hidden {
      opacity: 0;
      transform: translateY(-20px) scale(0.98);
      pointer-events: none;
    }

    .greeting-text {
      font-size: 42px;
      font-weight: 300;
      color: var(--text-greeting);
      margin-bottom: 36px;
      text-align: center;
      letter-spacing: -0.03em;
      width: 100%;
      max-width: 680px;
      padding: 0;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      column-gap: 12px;
    }

    .crew-roller {
      display: block;
      overflow: hidden;
      position: relative;
      min-width: 200px;
      text-align: left;
      height: 1.2em;
      line-height: 1.2em;
    }
    #crew-name {
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      color: #fff; /* Highlight color */
      font-weight: 400;
      transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.6s ease-in-out;
    }
    #crew-name.roll-out {
      transform: translateY(-100%);
      opacity: 0;
    }
    #crew-name.roll-in {
      transform: translateY(0);
      opacity: 1;
    }
    #crew-name.roll-prepare {
      transform: translateY(100%);
      opacity: 0;
      transition: none;
    }

    /* --- Pill Input Bar (Landing) — Floating glass pill with enhanced glow --- */
    .landing-pill {
      width: 100%;
      max-width: 680px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 2rem;
      display: flex;
      align-items: center;
      padding: 5px 8px 5px 6px;
      gap: 2px;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      box-shadow:
        var(--glass-shadow),
        0 0 20px 2px rgba(99, 102, 241, 0.12),
        0 0 60px 0 rgba(99, 102, 241, 0.06);
    }

    .landing-pill:focus-within {
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow:
        var(--glass-shadow),
        0 0 0 3px rgba(99, 102, 241, 0.15),
        0 0 30px 4px rgba(99, 102, 241, 0.18),
        0 0 80px 0 rgba(99, 102, 241, 0.08);
    }

    .pill-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .pill-btn:hover {
      color: var(--text-primary);
      background: var(--glass-hover);
    }

    .pill-btn svg { width: 18px; height: 18px; }

    .pill-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      padding: 10px 8px;
      min-width: 0;
    }

    .pill-input::placeholder { color: var(--text-dim); }

    /* Latency ping indicator */
    .latency-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      flex-shrink: 0;
      user-select: none;
    }

    .latency-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .latency-dot.good { background: var(--success); }
    .latency-dot.warn { background: var(--warning); }
    .latency-dot.bad  { background: var(--danger); }

    .latency-value {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 32px;
      text-align: right;
    }

    /* Mic button in pill — listening state */
    .pill-mic.listening {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .pill-mic.listening:hover { background: var(--accent-hover); }

    /* Preset suggestion chips on landing */
    .landing-presets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      max-width: 680px;
      padding: 0 20px;
    }

    .landing-chip {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: 12.5px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .landing-chip:hover {
      border-color: rgba(99, 102, 241, 0.35);
      color: var(--text-primary);
      background: rgba(99, 102, 241, 0.12);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .landing-chip.guardrail:hover {
      border-color: var(--danger-border);
      color: #fca5a5;
      background: var(--danger-bg);
    }

    /* ==========================================================================
       CONVERSATION VIEW — hidden until first query
       ========================================================================== */
    .conversation-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease 0.1s;
    }

    .conversation-view.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Conversation Top Bar — Glass */
    .conv-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      flex-shrink: 0;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      /* No harsh border */
    }

    .conv-topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .conv-topbar-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-sm {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 500;
      font-family: var(--font-mono);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
    }

    .badge-sm .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .badge-dot { background: var(--text-dim); }
    .badge-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .badge-dot.mock-mode { background: var(--warning); }

    /* Percentile latency stats */
    .percentile-stats {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }

    .percentile-stats .pct-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .percentile-stats .pct-label {
      color: var(--text-dim);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .percentile-stats .pct-value {
      color: var(--text-secondary);
    }

    .percentile-stats .pct-sep {
      color: rgba(255, 255, 255, 0.12);
    }
    .badge-dot.error { background: var(--danger); }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .btn-icon:hover {
      background: var(--glass-hover);
      color: var(--text-primary);
      border-color: var(--glass-border-hover);
    }
    .btn-icon svg { width: 14px; height: 14px; }

    /* Conversation scroll area */
    .conv-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .conv-content {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px 120px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Guardrail Banner — Glass */
    .guardrail-banner {
      display: none;
      background: rgba(248, 113, 113, 0.08);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--danger-border);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      align-items: flex-start;
      gap: 12px;
      color: #fca5a5;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(248, 113, 113, 0.08);
    }

    .guardrail-banner.active { display: flex; }
    .guardrail-content { flex: 1; }
    .guardrail-title { font-weight: 600; color: #fecaca; margin-bottom: 2px; }

    .guardrail-dismiss {
      background: transparent;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
      border-radius: 50%;
      transition: background var(--transition-fast);
    }
    .guardrail-dismiss:hover { background: rgba(248, 113, 113, 0.15); }

    /* Turn Block (Query + Response Pair) */
    .turn-block {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Query bubble — Glass pill */
    .turn-query {
      display: flex;
      justify-content: flex-end;
    }

    .query-bubble {
      background: rgba(99, 102, 241, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-lg);
      padding: 14px 20px;
      max-width: 75%;
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.6;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.08);
    }

    .query-bubble .transcript-partial {
      color: var(--text-muted);
      font-style: italic;
    }

    /* Response area */
    .turn-response {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .response-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .response-avatar {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
    }

    .response-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .response-body {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 60px;
      box-shadow: var(--glass-shadow);
    }

    .response-body .answer-cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: var(--accent);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.9s infinite;
      border-radius: 2px;
    }

    /* Topbar latency badge */
    .latency-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: transparent;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .latency-badge.has-value { color: var(--text-secondary); }

    /* TTS mute toggle — Glass */
    .btn-tts-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }
    .btn-tts-toggle:hover {
      background: var(--glass-hover);
      color: var(--text-primary);
      border-color: var(--glass-border-hover);
    }
    .btn-tts-toggle.muted { color: var(--danger); border-color: var(--danger-border); }
    .btn-tts-toggle svg { width: 14px; height: 14px; }

    /* Brain Mode Dropdown (Gemini-style "Pro ∨" selector) */
    .mode-dropdown-wrapper {
      position: relative;
      flex-shrink: 0;
      z-index: 50;
    }

    .mode-dropdown-trigger {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      color: rgba(255, 255, 255, 0.85);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
    }

    .mode-dropdown-trigger:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .mode-dropdown-trigger .chevron-icon {
      width: 14px;
      height: 14px;
      opacity: 0.6;
      transition: transform 0.25s ease;
    }

    .mode-dropdown-wrapper.open .mode-dropdown-trigger .chevron-icon {
      transform: rotate(180deg);
    }

    .mode-dropdown-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      min-width: 220px;
      background: rgba(28, 28, 32, 0.92);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255, 255, 255, 0.08);
      padding: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px) scale(0.96);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .mode-dropdown-wrapper.open .mode-dropdown-menu {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .mode-dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s ease;
      position: relative;
    }

    .mode-dropdown-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .mode-dropdown-item.active {
      background: rgba(255, 255, 255, 0.06);
    }

    .mode-dropdown-check {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-primary);
    }

    .mode-dropdown-check svg {
      width: 16px;
      height: 16px;
      opacity: 0;
    }

    .mode-dropdown-item.active .mode-dropdown-check svg {
      opacity: 1;
    }

    .mode-dropdown-info {
      flex: 1;
      min-width: 0;
    }

    .mode-dropdown-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .mode-dropdown-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .mode-dropdown-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      letter-spacing: 0.3px;
    }

    .mode-dropdown-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 4px 8px;
    }

    /* Mic listening pulse animation */
    .conv-mic-btn.listening,
    .pill-mic.listening {
      animation: mic-pulse 1.2s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.45); }
      50% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
    }

    /* Bottom input bar (within conversation) — Floating glass pill */
    .conv-input-bar {
      padding: 12px 24px 16px;
      background: transparent;
      flex-shrink: 0;
      /* No border-top */
    }

    .conv-input-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 2rem;
      padding: 5px 8px 5px 18px;
      box-shadow: var(--glass-shadow-lg);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .conv-input-inner:focus-within {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: var(--glass-shadow-lg), 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .conv-text-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 10px 0;
      min-width: 0;
    }

    .conv-text-input::placeholder { color: var(--text-dim); }

    .conv-mic-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .conv-mic-btn:hover {
      color: var(--text-primary);
      background: var(--glass-hover);
    }
    .conv-mic-btn.listening {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .conv-mic-btn svg { width: 18px; height: 18px; }

    .conv-send-btn {
      background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
      border: none;
      color: #fff;
      cursor: pointer;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
    }

    .conv-send-btn:hover {
      background: linear-gradient(135deg, var(--accent-hover) 0%, #6366f1 100%);
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }
    .conv-send-btn svg { width: 16px; height: 16px; }

    /* Read-only replay indicator — Glass */
    .replay-indicator {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      padding: 10px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      display: none;
    }

    .replay-indicator.active { display: block; }

    /* Keyframes */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .app-shell { padding: 0; gap: 0; }
      .sidebar {
        position: fixed; left: 4px; top: 4px; bottom: 4px;
        z-index: 100;
        border-radius: var(--radius-xl);
        width: calc(100vw - 40px);
        max-width: 320px;
        transform: translateX(0);
        box-shadow: var(--glass-shadow-lg);
      }
      .sidebar.collapsed {
        transform: translateX(-120%);
        width: calc(100vw - 40px);
        min-width: calc(100vw - 40px);
        border: none;
      }
      
      #btn-sidebar-open, #btn-sidebar-open-landing {
        display: flex !important;
      }

      .main-area {
        height: 100dvh;
        border-radius: 0;
        border: none;
      }

      .greeting-text { font-size: 26px; }
      .landing-pill { max-width: calc(100% - 16px); width: 100%; border-radius: var(--radius-lg); }
      
      /* Conversation layout — topbar + scroll + input all flex */
      .conversation-view {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      .conv-topbar { 
        padding: 8px 12px; 
        flex-shrink: 0;
        border-radius: 0;
      }
      .conv-scroll { 
        flex: 1; 
        min-height: 0; 
        overflow-y: auto; 
        -webkit-overflow-scrolling: touch; 
      }
      .conv-content { padding: 12px 12px 16px; gap: 18px; }
      .conv-input-bar { 
        flex-shrink: 0; 
        padding: 6px 8px 10px;
        background: rgba(5, 5, 10, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid var(--glass-border);
      }
      .conv-input-inner { padding: 4px 6px 4px 14px; }
      
      .query-bubble { max-width: 95%; }
      .response-bubble { max-width: 98%; padding: 14px; }
      .mode-label { display: none; }
    }

    @media (max-width: 480px) {
      .landing-presets { gap: 6px; flex-wrap: wrap; }
      .landing-chip { font-size: 11px; padding: 6px 12px; flex: 1 1 auto; text-align: center; justify-content: center; }
      .conv-input-inner { border-radius: var(--radius-lg); }
    }

    /* Custom scrollbar — Soft */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.18); }

    /* ==========================================================================
       SETTINGS MODAL — Glassmorphism panel
       ========================================================================== */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .settings-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 480px;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 60px);
      overflow-y: auto;
      background: rgba(15, 15, 22, 0.65);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-xl);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255,255,255,0.1);
      z-index: 201;
      padding: 28px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .settings-panel.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .settings-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .settings-close {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all var(--transition-fast);
    }
    .settings-close:hover {
      background: var(--glass-hover);
      color: var(--text-primary);
    }

    .settings-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .bg-picker-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .bg-option {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.25s ease;
      aspect-ratio: 16 / 9;
      background: rgba(0, 0, 0, 0.3);
    }
    .bg-option:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .bg-option.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow), 0 8px 24px rgba(99, 102, 241, 0.15);
    }

    .bg-option video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .bg-option-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 12px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      font-size: 11.5px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bg-option-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }
    .bg-option.active .bg-option-check {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Background -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_135039_b04d00db-6ee2-4e2a-a7f5-b2dfd3d24fd2.mp4" type="video/mp4">
  </video>
  <div id="bg-overlay"></div>


  <div class="app-shell">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar collapsed" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-logo">J</div>
          <span class="sidebar-brand-text">JARVIS</span>
        </div>
        <button class="btn-sidebar-toggle" id="btn-sidebar-toggle" title="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-actions">
        <button class="btn-new-chat" id="btn-new-chat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span class="sidebar-new-chat-text">New chat</span>
        </button>
      </div>

      <div class="conv-list" id="conv-list">
        <!-- Populated dynamically -->
      </div>

      <div class="sidebar-footer" id="sidebar-footer" title="Settings">
        <svg class="sidebar-footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="sidebar-footer-text">Settings</span>
      </div>
    </aside>

      <!-- ===== MAIN AREA ===== -->
    <div class="main-area">
      <!-- Mobile sidebar overlay -->
      <div id="mobile-sidebar-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:90; background:rgba(0,0,0,0.5); backdrop-filter:blur(3px);"></div>

      <!-- ===== LANDING SCREEN ===== -->
      <div class="landing-screen" id="landing-screen">
        
        <!-- Mobile menu button for landing screen -->
        <button class="btn-icon" id="btn-sidebar-open-landing" title="Open sidebar" style="display:none; position:absolute; top:12px; left:12px; z-index:10; background:var(--glass-bg); border:1px solid var(--glass-border); padding:8px; border-radius:12px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>

        <h1 class="greeting-text" id="greeting-text">
          <span>Let's jump in,</span>
          <span class="crew-roller"><span id="crew-name" class="roll-in">Straw Hats</span></span>
        </h1>

        <div class="landing-pill" id="landing-pill">

          <!-- Text input -->
          <input type="text" class="pill-input" id="landing-input" placeholder="Ask your question..." autocomplete="off">


          <!-- Hidden WS URL input — auto-detects production vs local -->
          <input type="hidden" id="input-ws-url" value="">
          <!-- Audio streaming controls -->
          <input type="hidden" id="audio-streaming-active" value="false">

          <!-- Mic button -->
          <button class="pill-btn pill-mic" id="landing-mic-btn" title="Tap to speak">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
        </div>

        <!-- Suggestion chips -->
        <div class="landing-presets">
          <button class="landing-chip" data-query="What is speculative vector search and how does parent-child chunking work?">💡 Speculative Vector Search</button>
          <button class="landing-chip" data-query="MSMARCO-XI dataset me Hindi aur English context kaise retrieve hota hai?">🌐 Hindi-English Hybrid</button>
          <button class="landing-chip guardrail" data-query="Write me a script to exploit an unauthenticated server.">🚫 Guardrail Test</button>
        </div>
      </div>

      <!-- ===== CONVERSATION VIEW ===== -->
      <div class="conversation-view" id="conversation-view">

        <!-- Top bar -->
        <div class="conv-topbar">
          <div class="conv-topbar-left">
            <button class="btn-icon" id="btn-sidebar-open" title="Open sidebar" style="display:none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            <span class="conv-topbar-title" id="conv-topbar-title">New Conversation</span>
          </div>
          <div class="conv-topbar-right">
            <span class="latency-badge" id="topbar-latency" title="Latest response latency"></span>
            <div class="percentile-stats" id="percentile-stats" title="Pipeline latency percentiles across queries">
              <span class="pct-item"><span class="pct-label">P50</span> <span class="pct-value" id="pct-p50">—</span></span>
              <span class="pct-sep">|</span>
              <span class="pct-item"><span class="pct-label">P70</span> <span class="pct-value" id="pct-p70">—</span></span>
              <span class="pct-sep">|</span>
              <span class="pct-item"><span class="pct-label">P100</span> <span class="pct-value" id="pct-p100">—</span></span>
              <span class="pct-sep">|</span>

  <!-- ==========================================================================
       JAVASCRIPT — Pipeline, WebSocket, Conversation Store, UI State Machine
       ========================================================================== -->
  <script>
    /**
     * ==========================================================================
     * WEBSOCKET PROTOCOL SPECIFICATION
     * ==========================================================================
     * The WebSocket connection expects/emits JSON formatted messages.
     *
     * 1. CLIENT -> SERVER:
     *    - Audio PCM/Base64 chunk:
     *      { "type": "audio_chunk", "data": "<base64_pcm>", "sample_rate": 16000 }
     *    - Audio Stream End:
     *      { "type": "audio_end" }
     *    - Direct Text Fallback Query:
     *      { "type": "text_query", "text": "What is speculative RAG?" }
     *
     * 2. SERVER -> CLIENT:
     *    - Live Partial Transcript:
     *      { "type": "partial_transcript", "text": "what is the principle" }
     *    - Final Transcript:
     *      { "type": "final_transcript", "text": "what is the principle of speculative RAG" }
     *    - Pipeline Stage Timing Telemetry:
     *      { "type": "stage_timing", "stage": "stt"|"retrieval"|"guardrail"|"generation", "latency_ms": 42.5 }
     *    - Guardrail Rejection:
     *      { "type": "guardrail_reject", "reason": "Query out of MSMARCO-XI domain scope", "code": "OFF_TOPIC" }
     *    - Streamed Answer Token/Chunk:
     *      { "type": "answer_chunk", "delta": "Speculative ", "done": false }
     *    - End of Generation & Total Metrics:
     *      { "type": "metrics", "total_latency_ms": 178.4, "stages": { "stt": 48, "retrieval": 36, "guardrail": 14, "generation": 80 }, "tokens": 42 }
     * ==========================================================================
     */

    /**
     * ==========================================================================
     * CONVERSATION PERSISTENCE — IN-MEMORY STORE
     * ==========================================================================
     * Architecture notes for the backend team:
     *
     * All conversation data lives in the `ConversationStore` object below.
     * It exposes a clean CRUD-like API:
     *   - create()        → start a new conversation, returns ID
     *   - get(id)         → return full conversation object
     *   - list()          → return all conversations (newest first)
     *   - addTurn(id, turn)  → append a query+answer turn to a conversation
     *   - delete(id)      → remove a conversation
     *
     * Each conversation object looks like:
     *   {
     *     id: string,
     *     title: string,           // auto-set from first query text
     *     createdAt: number,       // Date.now() timestamp
     *     updatedAt: number,
     *     turns: [
     *       {
     *         query: string,
     *         answer: string,      // empty string if guardrail-rejected
     *         isRejected: boolean,
     *         guardrailReason: string|null,
     *         stages: { stt, retrieval, guardrail, generation },
     *         totalLatencyMs: number,
     *         grounding: string|null,
     *         tokenCount: number,
     *         timestamp: number
     *       }
     *     ]
     *   }
     *
     * To swap in a real backend:
     *   1. Replace the internal `_conversations` Map with API calls.
     *   2. Each method is async-ready — just add `await` and change to fetch/axios.
     *   3. Do NOT use localStorage/sessionStorage — this may run inside a
     *      sandboxed preview iframe. The store is intentionally in-memory.
     * ==========================================================================
     */
    const ConversationStore = (() => {
      const _conversations = new Map();

      function _genId() {
        return 'conv_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      }

      return {
        create() {
          const conv = {
            id: _genId(),
            title: 'New Conversation',
            createdAt: Date.now(),
            updatedAt: Date.now(),
            turns: []
          };
          _conversations.set(conv.id, conv);
          return conv;
        },

        get(id) {
          return _conversations.get(id) || null;
        },

        list() {
          return [..._conversations.values()].sort((a, b) => b.updatedAt - a.updatedAt);
        },

        addTurn(id, turn) {
          const conv = _conversations.get(id);
          if (!conv) return;
          conv.turns.push(turn);
          if (conv.turns.length === 1) {
            conv.title = turn.query.slice(0, 80);
          }
          conv.updatedAt = Date.now();
        },

        delete(id) {
          _conversations.delete(id);
        }
      };
    })();


    // ==========================================================================
    // GLOBAL STATE
    // ==========================================================================
    let USE_MOCK = false;
    let ws = null;
    let isListening = false;
    let audioContext = null;
    let speechRecognition = null;
    let mockTimers = [];

    // App state machine: 'landing' | 'conversation'
    let appView = 'landing';
    let activeConversationId = null;
    let isReplayMode = false;

    // Current in-flight turn tracking
    let currentTurnQuery = '';
    let currentTurnAnswer = '';
    let currentTurnTokens = 0;
    let currentTurnRejected = false;
    let currentTurnGuardrailReason = null;
    let currentTurnGrounding = null;
    let currentStages = { stt: 0, retrieval: 0, guardrail: 0, generation: 0 };

    // Brain mode: 'strict' = dataset only, 'full' = LLM + dataset
    let brainMode = localStorage.getItem('brain_mode') || 'full';
    // Validate stored brain mode — remove invalid values (e.g. removed 'pro')
    if (!['full', 'strict'].includes(brainMode)) {
      brainMode = 'full';
      localStorage.setItem('brain_mode', brainMode);
      console.warn('Invalid brain_mode in localStorage, reset to full');
    }

    // Latency history across all conversations (for aggregate metrics)
    let queryLatencyHistory = [];

    // DOM refs (populated in init)
    let el = {};

    // Mock dataset
    const MOCK_DATASET = [
      {
        trigger: "speculative",
        answer: "Speculative Vector Search reduces end-to-end RAG latency by executing sub-vector probes concurrently with streaming speech tokens.\n\nKey Mechanics:\n1. Small Child Chunks (128 chars): Embedded with paraphrase-multilingual-MiniLM-L12-v2 for fast cosine lookup in Qdrant.\n2. Full Parent Context: Stored in vector payload to provide complete context directly to the synthesizer without multi-hop lookups.\n3. Speculative Trigger: Search executes as soon as partial STT confidence crosses threshold (p > 0.85), achieving <200ms TTFT.",
        stages: { stt: 44, retrieval: 38, guardrail: 12, generation: 74 },
        grounding: "Qdrant: msmarco_chunks (Score: 0.942)"
      },
      {
        trigger: "hindi",
        answer: "MSMARCO-XI dataset me dual-language indexing use hoti hai jisme English aur Hindi answers dono ko vector space me map kiya jata hai:\n\n• Multilingual Embeddings: 'paraphrase-multilingual-MiniLM-L12-v2' dono bhashaon ko ek hi shared embedding space me embed karta hai.\n• Unified Search: Hindi query par bhi English and Hindi dono parent passages retrieve ho sakte hain.\n• Real-time Latency: Qdrant cosine similarity average 35ms me accurate results fetch kar leta hai.",
        stages: { stt: 52, retrieval: 41, guardrail: 15, generation: 78 },
        grounding: "MSMARCO-XI hintrain.parquet (Score: 0.918)"
      },
      {
        trigger: "guardrail",
        reject: true,
        reason: "Query violates safety policy and dataset domain scope. Only queries related to the MSMARCO-XI knowledge corpus are permitted.",
        stages: { stt: 35, retrieval: 28, guardrail: 18, generation: 0 }
      },
      {
        trigger: "default",
        answer: "Retrieved relevant passage from local vector index with parent-child hierarchical grouping.\n\nThe speculative engine matched candidate embeddings in Qdrant and validated safety guardrails with zero ungrounded hallucinations.",
        stages: { stt: 45, retrieval: 36, guardrail: 14, generation: 82 },
        grounding: "Qdrant Index (Score: 0.884)"
      }
    ];


    // ==========================================================================
    // INITIALIZATION
    // ==========================================================================
    let audioUnlocked = false;
    function unlockAudioContext() {
      if (audioUnlocked) return;
      // Unlock Web Audio API
      if (window.AudioContext || window.webkitAudioContext) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const buffer = ctx.createBuffer(1, 1, 22050);
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        if (source.start) source.start(0);
        else source.noteOn(0);
        setTimeout(() => { if(ctx.state !== 'closed') ctx.close(); }, 100);
      }
      
      // Unlock HTML5 Audio
      const audio = new Audio();
      audio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
      audio.play().catch(() => {});
      
      audioUnlocked = true;
      document.removeEventListener('click', unlockAudioContext);
      document.removeEventListener('touchstart', unlockAudioContext);
    }

    // ==========================================================================
    // AUTO-DETECT BACKEND URL (Production vs Local)
    // ==========================================================================
    const LOCAL_BACKEND = 'ws://localhost:8000/ws/audio';
    const RENDER_BACKEND = 'wss://goa2.onrender.com/ws/audio';

    function getBackendWsUrl() {
      // If user already set a custom URL in settings, use it
      const savedUrl = localStorage.getItem('custom_ws_url');
      if (savedUrl) return savedUrl;

      // On localhost, use local backend
      const host = window.location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') {
        return LOCAL_BACKEND;
      }
      
      // On production (Vercel), default to the Render brain
      return RENDER_BACKEND;
    }

    let _wsReconnectAttempts = 0;
    const _wsMaxReconnectDelay = 10000;

    function init() {
      cacheElements();
      setupEventListeners();
      setupSpeechRecognition();
      setupTtsToggle();
      startCrewRoller();
      renderSidebarConversations();

      document.addEventListener('click', unlockAudioContext);
      document.addEventListener('touchstart', unlockAudioContext);

      // Set the auto-detected backend URL
      const backendUrl = getBackendWsUrl();
      el.inputWsUrl.value = backendUrl;
      console.log('Backend URL:', backendUrl);

      // Always start in Live mode. If connection fails 3 times, it will auto-switch to Mock mode.
      USE_MOCK = false;
      connectWebSocket();
      setupModeToggle();
      updateConvStatusBadge();
      // Note: calibrateNetworkRtt() runs on script load and also warms the server
    }

    function cacheElements() {
      el = {
        sidebar: document.getElementById('sidebar'),
        btnSidebarToggle: document.getElementById('btn-sidebar-toggle'),
        btnSidebarOpen: document.getElementById('btn-sidebar-open'),
        btnSidebarOpenLanding: document.getElementById('btn-sidebar-open-landing'),
        mobileSidebarOverlay: document.getElementById('mobile-sidebar-overlay'),
        btnNewChat: document.getElementById('btn-new-chat'),
        convList: document.getElementById('conv-list'),
        sidebarFooter: document.getElementById('sidebar-footer'),

        landingScreen: document.getElementById('landing-screen'),
        landingInput: document.getElementById('landing-input'),
        landingMicBtn: document.getElementById('landing-mic-btn'),
        latencyIndicator: document.getElementById('latency-indicator'),
        latencyDot: document.getElementById('latency-dot'),
        latencyValue: document.getElementById('latency-value'),
        inputWsUrl: document.getElementById('input-ws-url'),

        conversationView: document.getElementById('conversation-view'),
        convTopbarTitle: document.getElementById('conv-topbar-title'),
        convStatusDot: document.getElementById('conv-status-dot'),
        convStatusText: document.getElementById('conv-status-text'),
        convScroll: document.getElementById('conv-scroll'),
        convContent: document.getElementById('conv-content'),
        replayIndicator: document.getElementById('replay-indicator'),
        convInputBar: document.getElementById('conv-input-bar'),
        convTextInput: document.getElementById('conv-text-input'),
        convMicBtn: document.getElementById('conv-mic-btn'),
        convSendBtn: document.getElementById('conv-send-btn'),
        topbarLatency: document.getElementById('topbar-latency'),
      };
    }

    function setupEventListeners() {
      // Sidebar toggle
      el.btnSidebarToggle.addEventListener('click', () => {
        el.sidebar.classList.toggle('collapsed');
        if (window.innerWidth <= 768) {
          el.mobileSidebarOverlay.style.display = el.sidebar.classList.contains('collapsed') ? 'none' : 'block';
        }
      });

      const openSidebar = () => {
        el.sidebar.classList.remove('collapsed');
        if (window.innerWidth <= 768) {
          el.mobileSidebarOverlay.style.display = 'block';
        }
      };

      el.btnSidebarOpen?.addEventListener('click', openSidebar);
      el.btnSidebarOpenLanding?.addEventListener('click', openSidebar);

      el.mobileSidebarOverlay?.addEventListener('click', () => {
        el.sidebar.classList.add('collapsed');
        el.mobileSidebarOverlay.style.display = 'none';
      });

      // New chat
      el.btnNewChat.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          el.sidebar.classList.add('collapsed');
          el.mobileSidebarOverlay.style.display = 'none';
        }
        goToLanding();
      });

      // Landing input submission
      el.landingInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const q = el.landingInput.value.trim();
          if (q) submitQuery(q);
        }
      });

      // Landing mic
      el.landingMicBtn.addEventListener('click', () => {
        if (appView === 'landing') {
          toggleVoiceInput('landing');
        }
      });

      // Landing chips
      document.querySelectorAll('.landing-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          submitQuery(chip.getAttribute('data-query'));
        });
      });

      // Start latency ping indicator
      startLatencyPing();

      // Conversation view inputs
      el.convTextInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const q = el.convTextInput.value.trim();
          if (q) {
            el.convTextInput.value = '';
            submitQuery(q);
          }
        }
      });

      el.convSendBtn.addEventListener('click', () => {
        const q = el.convTextInput.value.trim();
        if (q) {
          el.convTextInput.value = '';
          submitQuery(q);
        }
      });

      el.convMicBtn.addEventListener('click', () => {
        toggleVoiceInput('conversation');
      });

      // Settings (sidebar footer) — open settings modal
      el.sidebarFooter.addEventListener('click', () => {
        if (el.sidebar.classList.contains('collapsed')) {
          el.sidebar.classList.remove('collapsed');
        }
        openSettings();
      });
    }


    // ==========================================================================
    // VIEW TRANSITIONS
    // ==========================================================================
    function goToLanding() {
      appView = 'landing';
      activeConversationId = null;
      isReplayMode = false;

      // Clear previous conversation DOM completely
      const replayIndicator = el.replayIndicator;
      el.convContent.innerHTML = '';
      el.convContent.appendChild(replayIndicator);  // Keep the replay indicator element

      // Reset topbar for next conversation
      el.convTopbarTitle.textContent = 'New Conversation';
      const latencyBadge = document.getElementById('topbar-latency');
      if (latencyBadge) {
        latencyBadge.textContent = '';
        latencyBadge.classList.remove('has-value');
      }

      // Stop any running mock timers
      clearTimers();

      // Reset turn state
      currentTurnQuery = '';
      currentTurnAnswer = '';
      currentTurnTokens = 0;
      currentTurnRejected = false;
      currentTurnGuardrailReason = null;
      currentTurnGrounding = null;
      currentStages = { stt: 0, retrieval: 0, guardrail: 0, generation: 0 };

      // Show landing, hide conversation
      el.landingScreen.classList.remove('hidden');
      el.conversationView.classList.remove('active');
      el.landingInput.value = '';
      el.landingInput.focus();
      renderSidebarConversations();
    }

    function goToConversation(convId, replay = false) {
      appView = 'conversation';
      activeConversationId = convId;
      isReplayMode = replay;

      el.landingScreen.classList.add('hidden');
      el.conversationView.classList.add('active');

      const conv = ConversationStore.get(convId);
      if (conv) {
        el.convTopbarTitle.textContent = conv.title;
      }

      // Show/hide replay indicator & input bar
      el.replayIndicator.classList.toggle('active', replay);
      el.convInputBar.style.display = replay ? 'none' : 'block';

      updateConvStatusBadge();

      if (replay) {
        renderFullConversation(conv);
      }

      renderSidebarConversations();

      // Scroll to bottom
      requestAnimationFrame(() => {
        el.convScroll.scrollTop = el.convScroll.scrollHeight;
      });
    }


    // ==========================================================================
    // QUERY SUBMISSION (Entry point for both landing & conversation)
    // ==========================================================================
    function submitQuery(queryText) {
      if (isReplayMode) return;
      clearTimers();

      // Ensure we have an active conversation
      if (!activeConversationId) {
        const conv = ConversationStore.create();
        activeConversationId = conv.id;

        // Clear old turn blocks for a truly fresh conversation
        const replayIndicator = el.replayIndicator;
        el.convContent.innerHTML = '';
        el.convContent.appendChild(replayIndicator);
      }

      // Transition to conversation view if on landing
      if (appView === 'landing') {
        goToConversation(activeConversationId, false);
      }

      // Reset turn state
      currentTurnQuery = queryText;
      currentTurnAnswer = '';
      currentTurnTokens = 0;
      currentTurnRejected = false;
      currentTurnGuardrailReason = null;
      currentTurnGrounding = null;
      currentStages = { stt: 0, retrieval: 0, guardrail: 0, generation: 0 };
      window._earlyTtsTriggered = false;  // Reset early TTS flag for new turn
      window._ttsChunks = [];  // Reset streaming audio chunks

      // Instantly clear inputs for UI responsiveness
      el.landingInput.value = '';
      el.convTextInput.value = '';

      // Add turn DOM block
      const turnEl = createTurnDOM(queryText);
      el.convContent.appendChild(turnEl);
      scrollToBottom();

      // Execute pipeline
      if (USE_MOCK) {
        executeMockPipeline(queryText, turnEl);
      } else if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "text_query", text: queryText }));
      } else {
        // Try reconnecting once, then fall back to mock
        console.warn('WebSocket not connected, attempting reconnect...');
        connectWebSocket();
        setTimeout(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "text_query", text: queryText }));
          } else {
            console.warn('Reconnect failed, falling back to mock mode');
            USE_MOCK = true;
            updateConvStatusBadge();
            executeMockPipeline(queryText, turnEl);
          }
        }, 1000);
      }
    }


    // ==========================================================================
    // TURN DOM CREATION
    // ==========================================================================
    function createTurnDOM(queryText) {
      const turnBlock = document.createElement('div');
      turnBlock.className = 'turn-block';
      turnBlock.setAttribute('data-turn-id', Date.now());

      turnBlock.innerHTML = `
        <!-- Guardrail banner -->
        <div class="guardrail-banner" data-role="guardrail">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div class="guardrail-content">
            <div class="guardrail-title">Query Rejected by Domain Guardrail</div>
            <div data-role="guardrail-reason"></div>
          </div>
          <button class="guardrail-dismiss" onclick="this.closest('.guardrail-banner').classList.remove('active')">&times;</button>
        </div>

        <!-- Query bubble -->
        <div class="turn-query">
          <div class="query-bubble">${escapeHtml(queryText)}</div>
        </div>

        <!-- Response -->
        <div class="turn-response">
          <div class="response-header">
            <div class="response-avatar">J</div>
            <span class="response-label">JARVIS</span>
            <button class="btn-icon btn-replay-voice" title="Replay voice" data-role="replay-voice" style="display: none; margin-left: auto;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
          </div>
          <div class="response-body" data-role="response-body">
            <span data-role="response-text"></span>
            <span class="answer-cursor" data-role="cursor"></span>
          </div>
        </div>
      `;

      return turnBlock;
    }


    // ==========================================================================
    // REAL-TIME PIPELINE — Fast, Cached, Pre-warmed
    // ==========================================================================
    const RENDER_API = '/api/ask'; // Vercel proxy — no CORS issue

    // Response cache — instant replay for repeated questions (LRU, 50 entries max)
    const _responseCache = new Map();
    function cacheGet(query, mode) {
      return _responseCache.get(`${mode}::${query.trim().toLowerCase()}`);
    }
    function cacheSet(query, mode, answer) {
      const key = `${mode}::${query.trim().toLowerCase()}`;
      if (_responseCache.size >= 50) {
        _responseCache.delete(_responseCache.keys().next().value);
      }
      _responseCache.set(key, answer);
    }

    // Pre-warm the Render server silently on page load
    function prewarmServer() {
      fetch(RENDER_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: 'hi', mode: 'strict' }),
      }).catch(() => {});
      console.log('🔥 Server pre-warmed');
    }

    // Network RTT calibration — measure actual round-trip time to subtract from latency
    let _networkRtt = 0; // Will be calibrated on load
    async function calibrateNetworkRtt() {
      const pings = [];
      for (let i = 0; i < 3; i++) {
        try {
          const t0 = performance.now();
          await fetch(RENDER_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: '', mode: 'strict' }),
          });
          const rtt = performance.now() - t0;
          pings.push(rtt);
        } catch {}
      }
      if (pings.length > 0) {
        // Use minimum ping as baseline (least congestion)
        _networkRtt = Math.round(Math.min(...pings));
        console.log(`🌐 Network RTT calibrated: ${_networkRtt}ms (from ${pings.length} pings)`);
      }
    }

    calibrateNetworkRtt();

    // ==========================================================================
    // SPECULATIVE PREFETCH — silently fetch answer while user is still typing
    // When user presses Send, result is already in cache → near-0ms response
    // ==========================================================================
    let _specPrefetchTimer = null;
    let _specPrefetchAbort = null;
    let _specLastPrefetchedQuery = '';

    async function speculativePrefetch(query, mode) {
      const q = query.trim();
      if (q.length < 3) return;
      if (q === _specLastPrefetchedQuery) return;
      if (cacheGet(q, mode)) return;

      if (_specPrefetchAbort) _specPrefetchAbort.abort();
      _specPrefetchAbort = new AbortController();
      _specLastPrefetchedQuery = q;

      try {
        console.log(`🔮 Speculative prefetch: "${q}" [${mode}]`);
        const resp = await fetch(RENDER_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, mode }),
          signal: _specPrefetchAbort.signal,
        });

        if (!resp.ok) return;

        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let prefetchedAnswer = '';
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data: ')) continue;
            const payload = trimmed.slice(6);
            if (payload === '[DONE]') break;
            try {
              prefetchedAnswer += JSON.parse(payload).answer ?? '';
            } catch {}
          }
        }

        if (prefetchedAnswer.length > 2) {
          cacheSet(q, mode, prefetchedAnswer);
          console.log(`✅ Cache primed: "${q}" → "${prefetchedAnswer.slice(0, 40)}..."`);
        }
      } catch (e) {
        if (e.name !== 'AbortError') console.warn('Prefetch error:', e.message);
      }
    }

    // Hook speculative prefetch onto both input boxes — ULTRA FAST debounce
    function setupSpeculativePrefetch() {
      const DEBOUNCE_MS = 200; // Fire after only 200ms pause (was 400ms)

      function onInput(e) {
        const q = e.target.value.trim();
        clearTimeout(_specPrefetchTimer);
        if (q.length < 3) return;
        _specPrefetchTimer = setTimeout(() => {
          speculativePrefetch(q, brainMode);
        }, DEBOUNCE_MS);
      }

      const landingInput = document.getElementById('landing-input');
      const convInput = document.getElementById('conv-text-input');
      if (landingInput) landingInput.addEventListener('input', onInput);
      if (convInput) convInput.addEventListener('input', onInput);
    }
    setupSpeculativePrefetch();

    // User's first query will be instant if it matches any of these
    // ==========================================================================
    async function preCachePopularQueries() {

      await new Promise(r => setTimeout(r, 2000));

      // Fetch them sequentially to avoid server flood, but silently
      for (const { q, m } of popularQueries) {
        if (cacheGet(q, m)) continue; // Already cached
        try {
          await speculativePrefetch(q, m);
          // Small delay between queries to not overwhelm server
          await new Promise(r => setTimeout(r, 300));
        } catch {}

      console.log('🔥 Pre-cache complete: popular queries warmed up');
